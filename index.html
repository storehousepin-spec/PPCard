<title>信用卡繳費資訊</title>
<style>
:root{--bg:#f3f5f2;--surface:#fff;--ink:#1d2b27;--muted:#66756f;--line:#d9e0dc;--accent:#0f6b55;--accent-ink:#fff;--warn:#b4432b;--soft:#e4efe9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a17;--surface:#1b2622;--ink:#e6efeb;--muted:#92a39c;--line:#2e3d37;--accent:#4cc3a0;--accent-ink:#0b1713;--warn:#f08a70;--soft:#22332c}}
:root[data-theme="dark"]{--bg:#121a17;--surface:#1b2622;--ink:#e6efeb;--muted:#92a39c;--line:#2e3d37;--accent:#4cc3a0;--accent-ink:#0b1713;--warn:#f08a70;--soft:#22332c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:4px 0 2px;letter-spacing:.02em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
button{font:inherit;padding:9px 14px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:4px 9px;font-size:13px}
button.ghost:hover{color:var(--warn);border-color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--soft);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.chip button{background:none;color:var(--muted);padding:0 6px;font-size:16px;line-height:1}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.form{grid-template-columns:1fr 1fr}}
.form .full{grid-column:1/-1}
.preview{margin-top:12px;padding:12px;border-radius:8px;background:var(--soft);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:13px}
@media(max-width:700px){.preview{grid-template-columns:1fr 1fr}}
.preview b{display:block;font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:5px 12px;font-size:13px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.sum{grid-template-columns:1fr 1fr}}
.sum div{border-left:3px solid var(--accent);padding-left:10px;color:var(--muted);font-size:13px}
.sum b{display:block;color:var(--ink);font-size:20px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:0}
.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.title{font-weight:600}
.meta{color:var(--muted);font-size:13px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0;font-size:13px;color:var(--muted)}
@media(max-width:700px){.nums{grid-template-columns:1fr 1fr 1fr}}
.nums b{display:block;color:var(--ink);font-size:15px}
.nums b.rate{color:var(--warn)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.acts{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);padding:12px 0}
.note{font-size:12px;color:var(--muted);margin-top:10px}
[hidden]{display:none!important}
textarea{width:100%;min-height:90px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:12px/1.4 monospace;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.nav button{background:transparent;color:var(--muted);border-radius:6px 6px 0 0;padding:9px 18px;border-bottom:3px solid transparent}
.nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--muted);font-weight:500}
tfoot td{font-weight:700;border-bottom:0;background:var(--soft)}
td.hl{color:var(--warn);font-weight:600}
</style>
</head>
<body>
<main>
<h1>信用卡繳費與分期試算</h1>
<p class="sub">新增持卡人、信用卡公司與分期資料，自動算出利息金額與利率。</p>
<div class="nav"><button id="navMain" class="on">分期管理</button><button id="navStats">統計</button><button id="navBackup">備份與還原</button></div>
<div id="viewMain">

<div class="grid2">
<section><h2>持卡人</h2>
<div class="row"><input id="pName" placeholder="輸入姓名，例如：王小明" maxlength="20"><button id="addP">新增</button></div>
<div class="chips" id="pChips"></div></section>
<section><h2>信用卡公司</h2>
<div class="row"><input id="cName" placeholder="輸入發卡銀行，例如：國泰世華" maxlength="20"><button id="addC">新增</button></div>
<div class="chips" id="cChips"></div></section>
</div>

<section><h2>新增分期</h2>
<div class="form">
<div><label>持卡人</label><select id="fP"></select></div>
<div><label>信用卡公司</label><select id="fC"></select></div>
<div class="full"><label>消費項目</label><input id="fItem" placeholder="例如：iPhone、家電、旅遊"></div>
<div><label>刷卡金額（本金）</label><input id="fPrin" type="number" min="0" inputmode="decimal"></div>
<div><label>分期期數</label><input id="fN" type="number" min="1" inputmode="numeric"></div>
<div><label>每期繳款金額</label><input id="fM" type="number" min="0" inputmode="decimal"></div>
<div><label>一次性手續費（選填）</label><input id="fFee" type="number" min="0" inputmode="decimal" placeholder="0"></div>
<div><label>已繳期數</label><input id="fPaid" type="number" min="0" inputmode="numeric" placeholder="0"></div>
<div><label>每月繳款日</label><input id="fDay" type="number" min="1" max="31" inputmode="numeric" placeholder="例如 15"></div>
</div>
<div class="preview" id="prev"></div>
<div class="acts"><button id="addI">新增分期</button><span class="meta" id="err" style="color:var(--warn)"></span></div>
<p class="note">利息總額 = 每期金額 × 期數 + 手續費 − 本金。年利率（APR）以每月現金流反推實質利率後 × 12 計算，通常高於銀行標示的「0.xx% 費率」。</p>
</section>

<section><h2>分期明細</h2>
<div class="tabs" id="tabs"></div>
<div class="sum" id="sum"></div>
<div id="list"></div>
</section>
</div>

<div id="viewBackup" hidden>
<section><h2>備份與還原</h2>
<p class="meta" style="margin:0 0 10px">換手機前先「複製備份」，存到備忘錄或傳給自己；新手機把內容貼在下方，按「貼上還原」即可。</p>
<textarea id="bk" placeholder="備份內容會顯示在這裡；還原時請在這裡貼上備份內容" spellcheck="false"></textarea>
<div class="acts"><button id="bkCopy">複製備份</button><button id="bkRestore">貼上還原</button><span class="meta" id="bkMsg"></span></div>
</section>
</div>

<div id="viewStats" hidden>
<section><h2>持卡人統計</h2><div class="scroll" id="stPerson"></div></section>
<section><h2>信用卡公司統計</h2><div class="scroll" id="stCard"></div></section>
<section><h2>未繳清分期明細</h2><div class="scroll" id="stDetail"></div></section>
</div>
</main>

<script>
const KEY="ccTracker.v1";
let S={people:[],cards:[],items:[]},filter="all";
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString("zh-TW");
const pct=n=>(n*100).toFixed(2)+"%";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function calc(prin,n,m,fee){
  const total=m*n+fee, interest=total-prin, net=prin-fee;
  let apr=0;
  if(m*n>net&&net>0&&n>0){
    let lo=0,hi=1;
    for(let i=0;i<80;i++){const r=(lo+hi)/2;let pv=0;for(let t=1;t<=n;t++)pv+=m/Math.pow(1+r,t);if(pv>net)lo=r;else hi=r}
    apr=((lo+hi)/2)*12;
  }
  return{total,interest,rate:prin>0?interest/prin:0,apr};
}

function mk(parent,tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;parent.appendChild(e);return e}

function chips(el,arr,kind){
  el.textContent="";
  if(!arr.length){mk(el,"span","尚未新增","meta");return}
  arr.forEach(n=>{const c=mk(el,"span",null,"chip");mk(c,"span",n);const b=mk(c,"button","×");b.title="刪除";b.setAttribute("aria-label","刪除 "+n);
    b.onclick=()=>{
      const used=S.items.some(i=>i[kind]===n);
      if(used&&!confirm("「"+n+"」底下有分期資料，刪除後相關分期也會一併刪除，確定嗎？"))return;
      S[kind==="person"?"people":"cards"]=arr.filter(x=>x!==n);
      S.items=S.items.filter(i=>i[kind]!==n);save();render()}});
}
function opts(sel,arr){const v=sel.value;sel.textContent="";arr.forEach(n=>{const o=mk(sel,"option",n);o.value=n});if(arr.includes(v))sel.value=v}

function add(kind){
  const inp=$(kind==="p"?"pName":"cName"),v=inp.value.trim(),arr=kind==="p"?S.people:S.cards;
  if(!v||arr.includes(v)){inp.focus();return}
  arr.push(v);inp.value="";save();render();
}
$("addP").onclick=()=>add("p");$("addC").onclick=()=>add("c");
$("pName").onkeydown=e=>{if(e.key==="Enter")add("p")};
$("cName").onkeydown=e=>{if(e.key==="Enter")add("c")};

const num=id=>parseFloat($(id).value)||0;
function preview(){
  const p=num("fPrin"),n=Math.floor(num("fN")),m=num("fM"),fee=num("fFee"),el=$("prev");
  el.textContent="";
  if(!(p>0&&n>0&&m>0)){mk(el,"span","填入本金、期數與每期金額後，這裡會即時顯示利息試算。","meta");el.style.display="block";return}
  el.style.display="grid";
  const r=calc(p,n,m,fee);
  [["應繳總額","$"+fmt(r.total)],["利息金額","$"+fmt(r.interest)],["總利率",pct(r.rate)],["年利率 APR",pct(r.apr)]].forEach(([a,b])=>{const d=mk(el,"div",a);mk(d,"b",b)});
}
["fPrin","fN","fM","fFee"].forEach(id=>$(id).oninput=preview);

$("addI").onclick=()=>{
  const err=$("err");err.textContent="";
  const p=num("fPrin"),n=Math.floor(num("fN")),m=num("fM");
  if(!S.people.length||!S.cards.length){err.textContent="請先新增持卡人與信用卡公司。";return}
  if(!(p>0&&n>0&&m>0)){err.textContent="本金、期數、每期金額都必須大於 0。";return}
  const paid=Math.min(n,Math.max(0,Math.floor(num("fPaid"))));
  S.items.push({id:uid(),person:$("fP").value,card:$("fC").value,name:$("fItem").value.trim()||"未命名消費",prin:p,n,m,fee:num("fFee"),paid,day:Math.min(31,Math.floor(num("fDay")))||0});
  ["fItem","fPrin","fN","fM","fFee","fPaid","fDay"].forEach(id=>$(id).value="");
  save();render();
};

function render(){
  chips($("pChips"),S.people,"person");chips($("cChips"),S.cards,"card");
  opts($("fP"),S.people);opts($("fC"),S.cards);preview();
  if(filter!=="all"&&!S.people.includes(filter))filter="all";
  const tabs=$("tabs");tabs.textContent="";
  ["all",...S.people].forEach(n=>{const b=mk(tabs,"button",n==="all"?"全部":n);if(n===filter)b.className="on";b.onclick=()=>{filter=n;render()}});
  const items=S.items.filter(i=>filter==="all"||i.person===filter);
  let monthly=0,remain=0,interest=0,prin=0;
  items.forEach(i=>{const r=calc(i.prin,i.n,i.m,i.fee);interest+=r.interest;prin+=i.prin;if(i.paid<i.n){monthly+=i.m;remain+=(i.n-i.paid)*i.m}});
  const sum=$("sum");sum.textContent="";
  [["每月應繳","$"+fmt(monthly)],["剩餘未繳","$"+fmt(remain)],["利息總額","$"+fmt(interest)],["整體利率",pct(prin?interest/prin:0)]].forEach(([a,b])=>{const d=mk(sum,"div",a);mk(d,"b",b)});
  const list=$("list");list.textContent="";
  if(!items.length){mk(list,"div","還沒有分期資料。從上方「新增分期」開始。","empty");return}
  items.forEach(i=>{
    const r=calc(i.prin,i.n,i.m,i.fee),done=i.paid>=i.n,box=mk(list,"div",null,"item");
    const h=mk(box,"div",null,"head"),l=mk(h,"div");
    mk(l,"div",i.name,"title");
    mk(l,"div",i.person+"・"+i.card+(i.day?"・每月 "+i.day+" 日":""),"meta");
    mk(h,"div",done?"已繳清":"剩餘 "+(i.n-i.paid)+" 期 / $"+fmt((i.n-i.paid)*i.m),"meta");
    const g=mk(box,"div",null,"nums");
    [["本金","$"+fmt(i.prin)],["每期","$"+fmt(i.m)+" × "+i.n],["利息金額","$"+fmt(r.interest)],["總利率",pct(r.rate)],["年利率 APR",pct(r.apr)]].forEach(([a,b],k)=>{const d=mk(g,"div",a);const x=mk(d,"b",b);if(k>=3)x.className="rate"});
    const bar=mk(box,"div",null,"bar"),f=mk(bar,"i");f.style.width=(i.paid/i.n*100)+"%";
    const a=mk(box,"div",null,"acts");
    mk(a,"span","已繳 "+i.paid+" / "+i.n+" 期","meta");
    const up=mk(a,"button","已繳 +1","ghost");up.disabled=done;up.onclick=()=>{i.paid++;save();render()};
    const dn=mk(a,"button","已繳 −1","ghost");dn.disabled=i.paid<=0;dn.onclick=()=>{i.paid--;save();render()};
    const del=mk(a,"button","刪除","ghost");del.onclick=()=>{if(confirm("刪除「"+i.name+"」？")){S.items=S.items.filter(x=>x.id!==i.id);save();render()}};
  });
}
function setView(v){
  [["Main","main"],["Stats","stats"],["Backup","backup"]].forEach(([k,n])=>{
    $("view"+k).hidden=v!==n;$("nav"+k).className=v===n?"on":"";
  });
}
$("navMain").onclick=()=>setView("main");
$("navStats").onclick=()=>setView("stats");
$("navBackup").onclick=()=>setView("backup");

function table(parent,heads,rows,foot){
  parent.textContent="";
  if(!rows.length){mk(parent,"div","還沒有資料。","empty");return}
  const t=mk(parent,"table"),hr=mk(mk(t,"thead"),"tr");
  heads.forEach(h=>mk(hr,"th",h));
  const tb=mk(t,"tbody");
  rows.forEach(r=>{const tr=mk(tb,"tr");r.forEach((c,k)=>{const td=mk(tr,"td",c);if(k===heads.hl)td.className="hl"})});
  if(foot){const fr=mk(mk(t,"tfoot"),"tr");foot.forEach(c=>mk(fr,"td",c))}
}
function agg(keys,field){
  const rows=[],tot={cnt:0,act:0,prin:0,total:0,remain:0,month:0};
  keys.forEach(k=>{
    const a={cnt:0,act:0,prin:0,total:0,remain:0,month:0};
    S.items.filter(i=>i[field]===k).forEach(i=>{
      const left=(i.n-i.paid)*i.m;
      a.cnt++;a.prin+=i.prin;a.total+=i.m*i.n+i.fee;a.remain+=left;
      if(i.paid<i.n){a.act++;a.month+=i.m}
    });
    Object.keys(tot).forEach(x=>tot[x]+=a[x]);
    rows.push([k,a.act+" / "+a.cnt+" 筆","$"+fmt(a.prin),"$"+fmt(a.total),"$"+fmt(a.total-a.remain),"$"+fmt(a.remain),"$"+fmt(a.month)]);
  });
  return{rows,foot:["合計",tot.act+" / "+tot.cnt+" 筆","$"+fmt(tot.prin),"$"+fmt(tot.total),"$"+fmt(tot.total-tot.remain),"$"+fmt(tot.remain),"$"+fmt(tot.month)]};
}
function renderStats(){
  const heads=["","分期筆數（未繳清 / 全部）","分期金額（本金）","應繳總額","已繳金額","剩餘應繳金額","每月應繳"];
  heads.hl=5;
  const hp=heads.slice();hp[0]="持卡人";hp.hl=5;
  const hc=heads.slice();hc[0]="信用卡公司";hc.hl=5;
  let a=agg(S.people,"person");table($("stPerson"),hp,a.rows,S.people.length?a.foot:null);
  a=agg(S.cards,"card");table($("stCard"),hc,a.rows,S.cards.length?a.foot:null);
  const open=S.items.filter(i=>i.paid<i.n).sort((x,y)=>x.person.localeCompare(y.person,"zh-TW"));
  const dh=["持卡人","信用卡","項目","每期金額","剩餘期數","剩餘金額"];dh.hl=5;
  const left=open.reduce((s,i)=>s+(i.n-i.paid)*i.m,0);
  table($("stDetail"),dh,open.map(i=>[i.person,i.card,i.name,"$"+fmt(i.m),(i.n-i.paid)+" / "+i.n+" 期","$"+fmt((i.n-i.paid)*i.m)]),open.length?["合計","",open.length+" 筆","","","$"+fmt(left)]:null);
  // text cells in detail table: left-align text columns
  document.querySelectorAll("#stDetail tr").forEach(tr=>{[1,2].forEach(k=>{if(tr.children[k])tr.children[k].style.textAlign="left"})});
}
const bk=$("bk"),bkMsg=$("bkMsg");
$("bkCopy").onclick=async()=>{
  bk.value="CCBACKUP1:"+JSON.stringify(S);
  let ok=false;
  try{await navigator.clipboard.writeText(bk.value);ok=true}catch(e){}
  if(!ok){try{bk.focus();bk.select();bk.setSelectionRange(0,bk.value.length);ok=document.execCommand("copy")}catch(e){}}
  bkMsg.style.color="";
  bkMsg.textContent=ok?"已複製整份資料。":"無法自動複製，請長按上方文字框全選後複製。";
};
$("bkRestore").onclick=async()=>{
  bkMsg.style.color="var(--warn)";
  let t=bk.value.trim();
  if(!t){try{t=(await navigator.clipboard.readText()).trim();bk.value=t}catch(e){}}
  if(!t){bkMsg.textContent="請先把備份內容貼在上方文字框。";return}
  try{
    const d=JSON.parse(t.replace(/^CCBACKUP1:/,""));
    if(!Array.isArray(d.people)||!Array.isArray(d.cards)||!Array.isArray(d.items))throw 0;
    const n=x=>Number(x)||0;
    const next={
      people:d.people.map(String),cards:d.cards.map(String),
      items:d.items.map(i=>({id:String(i.id||uid()),person:String(i.person),card:String(i.card),name:String(i.name||"未命名消費"),prin:n(i.prin),n:Math.max(1,Math.floor(n(i.n))),m:n(i.m),fee:n(i.fee),paid:Math.max(0,Math.floor(n(i.paid))),day:Math.floor(n(i.day))}))
    };
    if(!confirm("還原會取代這支手機目前的所有資料（"+next.people.length+" 位持卡人、"+next.cards.length+" 家信用卡、"+next.items.length+" 筆分期），確定嗎？"))return;
    S=next;save();filter="all";render();
    bk.value="";bkMsg.style.color="";bkMsg.textContent="已還原。";
  }catch(e){bkMsg.textContent="備份內容格式不正確，請確認有完整複製。"}
};

const _render=render;
render=function(){_render();renderStats()};
render();
</script>
</body>
</html>
